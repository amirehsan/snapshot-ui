name: Bug report
description: Something renders or behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A minimal example, ideally a link to a sandbox.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package versions
      placeholder: '@snapshot-ui/react 0.4.0, @snapshot-ui/core 0.4.0, @snapshot-ui/charts 0.1.0'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 18 on macOS 15
